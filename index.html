<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a5b53">
<title>PulseEdge AI</title><style>
*{
    box-sizing:border-box
}
html,body{
    margin:0;
    min-width:320px;
    background:#f7f7f3;
    color:#263a39;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px
}
button,input,textarea{
    font:inherit
}
button{
    cursor:pointer
}
.header{
    position:sticky;
    top:0;
    z-index:10;
    height:64px;
    border-bottom:1px solid #dce4df;
    background:#fafaf7f7;
    backdrop-filter:blur(10px)
}
.headerin{
    height:100%;
    max-width:1440px;
    margin:auto;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:0;
    color:#263a39;
    text-align:left
}
.mark{
    width:40px;
    height:40px;
    border-radius:9px;
    background:#0a7168;
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:900
}
.brand b{
    display:block;
    font-size:16px
}
.brand small{
    display:block;
    margin-top:3px;
    font-size:9px;
    letter-spacing:.13em;
    color:#71817f;
    font-weight:800;
    text-transform:uppercase
}
.nav{
    display:none;
    gap:4px
}
.nav button{
    border:0;
    background:transparent;
    border-radius:7px;
    padding:9px 11px;
    color:#697875;
    font-weight:700
}
.nav button.active{
    background:#edf0ed;
    color:#263a39
}
.headright{
    display:flex;
    align-items:center;
    gap:7px
}
.ai{
    display:none;
    color:#697875;
    font-size:11px;
    font-weight:700
}
.offline{
    border:1px solid #b9ddd6;
    background:#edf8f5;
    color:#0a7168;
    border-radius:999px;
    padding:6px 9px;
    font-size:10px;
    font-weight:800
}
.banner{
    background:#f1e6bd;
    color:#66552a;
    border-bottom:1px solid #e4d49a;
    padding:7px;
    text-align:center;
    font-size:10px;
    font-weight:800;
    letter-spacing:.1em
}
.main{
    max-width:1440px;
    margin:auto;
    padding:24px 16px 90px
}
.footer{
    border-top:1px solid #dce4df;
    text-align:center;
    padding:24px;
    color:#788783;
    font-size:10px
}
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:20;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:#fafaf7f7;
    border-top:1px solid #dce4df;
    padding:5px 5px max(5px,env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px #1d343614
}
.bottom button{
    border:0;
    background:transparent;
    color:#788783;
    font-size:10px;
    font-weight:700;
    padding:7px 2px
}
.bottom button.active{
    color:#0a7168
}
.ico{
    display:block;
    font-size:17px;
    margin-bottom:2px
}
.hero{
    display:grid;
    gap:25px;
    align-items:center;
    border-bottom:1px solid #dce4df;
    padding:18px 0 28px
}
.eyebrow{
    font-size:10px;
    font-weight:900;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#0a7168
}
.hero h1,.heading h1{
    font-size:36px;
    line-height:1.04;
    margin:8px 0 0;
    letter-spacing:-.02em
}
.hero h2{
    font-size:19px;
    line-height:1.4;
    margin:14px 0
}
.muted{
    color:#6d7d7a;
    line-height:1.55
}
.hero p{
    max-width:660px;
    line-height:1.7
}
.card,.info,.report{
    background:#fff;
    border:1px solid #dce4df;
    border-radius:9px;
    padding:18px;
    box-shadow:0 10px 30px #1d343912
}
.scenario{
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid #dce4df;
    border-radius:8px;
    padding:13px;
    margin-top:9px
}
.scenario strong{
    display:flex;
    justify-content:space-between
}
.scenario.selected{
    border-color:#0a7168;
    background:#edf8f5
}
.radio{
    width:15px;
    height:15px;
    border:4px solid #0a7168;
    border-radius:50%
}
.dark{
    margin-top:15px;
    background:#263d3b;
    color:#fff;
    border-radius:8px;
    padding:14px;
    display:flex;
    gap:10px
}
.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px
}
.stat{
    background:#fff;
    border:1px solid #dce4df;
    border-radius:8px;
    padding:15px
}
.stat h3{
    font-size:13px;
    margin:9px 0 4px
}
.stat p{
    font-size:10px;
    color:#6d7d7a;
    margin:0
}
.heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:15px;
    border-bottom:1px solid #dce4df;
    padding-bottom:19px;
    margin-bottom:20px
}
.heading p{
    max-width:680px;
    margin:8px 0 0;
    color:#6d7d7a;
    line-height:1.6
}
.caseid{
    white-space:nowrap;
    border:1px solid #dce4df;
    background:#fff;
    border-radius:7px;
    padding:9px;
    font-size:10px
}
.steps{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    overflow:hidden;
    border:1px solid #dce4df;
    border-radius:8px;
    background:#fff;
    margin-bottom:20px
}
.step{
    padding:11px 3px;
    text-align:center;
    font-size:10px;
    font-weight:800;
    color:#788783
}
.step.done{
    background:#edf8f5;
    color:#0a7168
}
.step+ .step{
    border-left:1px solid #dce4df
}
.grid2{
    display:grid;
    gap:14px
}
.title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px
}
.titleicon{
    width:36px;
    height:36px;
    border-radius:7px;
    background:#f0f2ef;
    color:#0a7168;
    display:grid;
    place-items:center
}
.title h2{
    font-size:16px;
    margin:0
}
.row{
    display:flex;
    gap:9px
}
.btn{
    border:0;
    border-radius:7px;
    background:#0a7168;
    color:#fff;
    padding:12px 15px;
    font-weight:800;
    min-height:44px
}
.btn.out{
    background:#fff;
    color:#263a39;
    border:1px solid #ccd8d3
}
.btn.soft{
    background:#e9f3ef;
    color:#0a7168
}
.full{
    width:100%
}
label{
    display:block;
    margin:14px 0 7px;
    font-size:10px;
    font-weight:800;
    color:#536461
}
textarea,input{
    width:100%;
    padding:11px;
    border:1px solid #ccd8d3;
    border-radius:7px;
    background:#fff;
    color:#263a39;
    outline:none
}
textarea{
    min-height:105px
}
.visual{
    min-height:170px;
    border:1px dashed #cbd7d2;
    border-radius:8px;
    background:#f7f8f5;
    display:grid;
    place-items:center;
    text-align:center;
    color:#7b8986
}
.visual img,.camera{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:8px
}
.vitals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}
.process{
    max-width:560px;
    margin:auto
}
.processbox{
    background:#fff;
    border:1px solid #dce4df;
    border-radius:9px;
    padding:20px
}
.processitem{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid #dce4df;
    border-radius:7px;
    padding:11px;
    margin:7px 0
}
.num{
    width:21px;
    height:21px;
    border-radius:50%;
    background:#f0f2ef;
    display:grid;
    place-items:center;
    font-size:9px;
    font-weight:900
}
.num.done{
    background:#0a7168;
    color:#fff
}
.num.now{
    background:#fff3cf;
    color:#9a731f
}
.structured{
    display:grid;
    gap:14px
}
.dl{
    border-bottom:1px solid #dce4df;
    padding-bottom:10px;
    margin-bottom:12px
}
.dl dt{
    font-size:10px;
    font-weight:800;
    color:#758481
}
.dl dd{
    font-size:13px;
    font-weight:800;
    margin:4px 0
}
.safety{
    background:#edf8f5;
    color:#0a7168;
    padding:13px;
    border-radius:7px;
    font-size:11px;
    font-weight:700;
    line-height:1.5
}
.details{
    background:#fff;
    border:1px solid #dce4df;
    border-radius:9px;
    padding:15px;
    margin-top:14px
}
.code{
    margin-top:10px;
    background:#263d3b;
    color:#fff;
    padding:12px;
    border-radius:7px;
    font-size:11px;
    font-weight:800
}
.result{
    border:2px solid #0a7168;
    background:#edf8f5;
    color:#0a7168;
    border-radius:9px;
    padding:22px
}
.result.urgent{
    border-color:#c64f48;
    background:#fff0ef;
    color:#a83b36
}
.result.review{
    border-color:#bd8a25;
    background:#fff8e7;
    color:#8e681e
}
.risk{
    font-size:45px;
    font-weight:900;
    margin-top:5px
}
.resultaction{
    background:#fff9;
    color:#263a39;
    border-radius:7px;
    padding:12px;
    font-size:11px;
    font-weight:800
}
..two{
    display:grid;
    gap:14px;
    margin-top:14px
}
.reporthead{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:2px solid #263a39;
    padding-bottom:17px
}
.report h2{
    font-size:24px;
    margin:5px 0
}
.reportgrid{
    display:grid;
    gap:15px;
    padding:20px 0
}
.architecture{
    background:#263d3b;
    color:#fff;
    border-radius:9px;
    padding:20px
}
.flow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px
}
.flow div{
    border:1px solid #ffffff22;
    background:#ffffff08;
    border-radius:7px;
    padding:12px;
    font-size:11px;
    font-weight:700
}
.settings{
    display:flex;
    gap:12px;
    align-items:center;
    padding:16px 0;
    border-bottom:1px solid #dce4df
}
.switch{
    width:40px;
    height:23px;
    border-radius:20px;
    background:#0a7168;
    position:relative
}
.switch:after{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#fff;
    right:3px;
    top:3px
}
.toast{
    position:fixed;
    top:74px;
    left:14px;
    right:14px;
    z-index:50;
    background:#263d3b;
    color:#fff;
    padding:11px;
    border-radius:8px;
    text-align:center;
    font-size:11px;
    font-weight:700
}
.hidden{
    display:none
}
@media(min-width:760px){
    .nav{
        display:flex
    }
    .ai{
        display:inline
    }
    .bottom{
        display:none
    }
    .main{
        padding-bottom:45px
    }
    .hero{
        grid-template-columns:1.15fr .85fr;
        padding-top:28px
    }
    .stats{
        grid-template-columns:repeat(4,1fr)
    }
    .grid2{
        grid-template-columns:1fr 1fr
    }
    .grid2 .wide{
        grid-column:1/-1
    }
    .vitals{
        grid-template-columns:repeat(5,1fr)
    }
    .structured{
        grid-template-columns:1.35fr .65fr
    }
    .two{
        grid-template-columns:1fr 1fr
    }
    .reportgrid{
        grid-template-columns:1fr 1fr
    }
    .flow{
        grid-template-columns:repeat(4,1fr)
    }
}
</style></head>
<body>
<header class="header">
<div class="headerin">
<button class="brand" onclick="home()">
<span class="mark">⌁</span>
<span>
<b>PulseEdge AI</b>
<small>Risk & referral assistant</small>
</span>
</button>
<nav class="nav">
<button id="homeNav" onclick="home()">Home</button>
<button id="caseNav" onclick="capture()">New case</button>
<button id="archNav" onclick="architecture()">Architecture</button>
<button id="setNav" onclick="settings()">Settings</button>
</nav>
<div class="headright">
<span class="ai">◉ On-device AI</span>
<span class="offline">● OFFLINE</span>
<a href="PulseEdgeAI_Offline_Demo.apk"
   download="PulseEdgeAI_Offline_Demo.apk"
   class="apk-download-btn">
  <span class="download-icon">↓</span>
  <span>
    <strong>Download Android APK</strong>
    <small>Offline Demo • Android</small>
  </span>
</a>

<style>
  .apk-download-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
    margin: 18px 0;
    border-radius: 14px;
    text-decoration: none;
    color: #ffffff;
    background: linear-gradient(135deg, #536b9f, #2f2d57);
    box-shadow: 0 8px 24px rgba(39, 50, 71, 0.25);
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .apk-download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
  }

  .apk-download-btn:active {
    transform: translateY(0);
  }

  .download-icon {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: rgba(255,255,255,0.16);
    font-size: 25px;
    font-weight: 700;
  }

  .apk-download-btn strong {
    display: block;
    font-size: 10px;
    line-height: 1.3;
  }

  .apk-download-btn small {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    opacity: 0.8;
  }
</style>
</div>
</div>
</header>
<div class="banner">✓ Demo / Prototype · Not a medical device</div>
<main class="main" id="main">
</main>
<footer class="footer">PulseEdge AI • Hackathon Prototype • Not a medical device</footer>
<nav class="bottom">
<button onclick="home()">
<span class="ico">⌂</span>Home</button>
<button onclick="capture()">
<span class="ico">＋</span>New case</button>
<button onclick="architecture()">
<span class="ico">▦</span>Architecture</button>
<button onclick="settings()">
<span class="ico">⚙</span>Settings</button>
</nav>
<div id="toast" class="toast hidden">
</div>
<script>
const KEY='pulseedge-demo-case';
let d=load()||{
    caseId:'PE-'+new Date().getFullYear()+'-'+Math.floor(100+Math.random()*900),scenario:'maternal',observation:'',language:'Telugu',systolic:'',diastolic:'',pulse:'',temperature:'',spo2:'',image:'',createdAt:new Date().toISOString()
};
function save(){
    localStorage.setItem(KEY,JSON.stringify(d))
}
function load(){
    try{
        return JSON.parse(localStorage.getItem(KEY))
    }
    catch(e){
        return null
    }
}
function toast(x){
    let t=document.getElementById('toast');
    t.textContent=x;
    t.classList.remove('hidden');
    setTimeout(()=>t.classList.add('hidden'),1700)
}
function active(x){
    ['home','case','arch','set'].forEach(k=>{
        let e=document.getElementById(k+'Nav');
        if(e)e.classList.toggle('active',k===x)
    })
}
function sh(x){
    document.getElementById('main').innerHTML=x
}
function head(a,b,c){
    return `<div class="heading"><div><div class="eyebrow">${a}</div><h1>${b}</h1><p>${c}</p></div><div class="caseid">Case ID <b>${d.caseId}</b></div></div>`
}
function steps(n){
    return `<div class="steps">${['Capture','Structure','Validate','Refer'].map((x,i)=>`<div class="step ${i<n?'done':''}">${
        i+1
    }. ${
        x
    }
    </div>`).join('')}</div>`
}
function home(){
    active('home');
    sh(`<section class="hero"><div><div class="eyebrow">Local AI Demo</div><h1>PulseEdge AI</h1><h2>Offline risk & referral assistance for frontline health workers.</h2><p class="muted">Voice, camera and patient observations. Structured locally. Validated by deterministic safety rules. Designed to work when connectivity doesn’t.</p><div class="row"><button class="btn" onclick="capture()">Start assessment →</button><button class="btn out" onclick="architecture()">View architecture</button></div></div><div class="card"><div class="eyebrow">Choose demo scenario</div><button class="scenario selected" onclick="demo()"><strong>Maternal risk demo <span class="radio"></span></strong><span class="muted">Headache, blurred vision and elevated blood pressure.</span></button><button class="scenario" onclick="child()"><strong>Child / newborn demo <span class="radio" style="border-color:#dce4df"></span></strong><span class="muted">General observation capture and routine threshold demonstration.</span></button><div class="dark"><span style="color:#f2d37a">◉</span><div><b>No internet required for core demo</b><div style="color:#b7c8c5;font-size:11px;margin-top:3px">Case capture, rules, result, and report run on this device.</div></div></div></div></section><section class="stats"><div class="stat"><b style="color:#0a7168">⌁</b><h3>Offline-first</h3><p>Core workflow stays available</p></div><div class="stat"><b style="color:#0a7168">文</b><h3>Multilingual input</h3><p>Voice and text capture</p></div><div class="stat"><b style="color:#0a7168">✓</b><h3>Explainable rules</h3><p>Every escalation shows why</p></div><div class="stat"><b style="color:#0a7168">▣</b><h3>Encrypted local storage</h3><p>Prototype target architecture</p></div></section>`)
}
function demo(){
    d={
        ...d,scenario:'maternal',observation:'Patient ki severe headache undi, vision blurred ga undi.',language:'Telugu',systolic:'165',diastolic:'110',pulse:'92',temperature:'37.1',spo2:'98'
    };
    save();
    capture()
}
function child(){
    d={
        ...d,scenario:'child',observation:'Child is unusually sleepy and feeding less since morning.',language:'English',systolic:'102',diastolic:'68',pulse:'108',temperature:'38.1',spo2:'96'
    };
    save();
    capture()
}
function capture(){
    active('case');
    sh(head('New case','Capture observations','Collect what you can. PulseEdge structures the information locally before safety rules evaluate it.')+steps(1)+`<div class="grid2"><section class="info"><div class="title"><span class="titleicon">◉</span><h2>Voice observation</h2></div><div class="row"><button class="btn" onclick="voice()">🎙 Record observation</button><button class="btn out" onclick="sample()">Use sample</button></div><label>Text fallback</label><textarea id="obs" placeholder="Type the patient observation…">${d.observation||''}</textarea><small class="muted">Sample: Patient ki severe headache undi, vision blurred ga undi.</small></section><section class="info"><div class="title"><span class="titleicon">▧</span><h2>Visual evidence</h2></div><div id="visual" class="visual">▧<br>No visual evidence captured</div><div class="row" style="margin-top:10px"><button class="btn out" onclick="cam()">📷 Open camera</button><button class="btn out" onclick="upload()">▧ Upload image</button></div><video id="video" class="camera hidden" autoplay playsinline></video></section><section class="info wide"><div class="title"><span class="titleicon">♧</span><h2>Vitals</h2></div><div class="vitals">${f('systolic','BP systolic','mmHg')}${f('diastolic','BP diastolic','mmHg')}${f('pulse','Pulse','bpm')}${f('temperature','Temperature','°C')}${f('spo2','SpO₂','%')}</div><button class="btn soft" style="margin-top:12px" onclick="fill()">↻ Use demo values</button></section></div><button class="btn full" style="margin-top:14px" onclick="goStructure()">Continue to structure →</button>`)
}
function f(k,l,u){
    return `<div><label>${l}</label><div style="position:relative"><input id="${k}" value="${d[k]||''}" inputmode="decimal"><span style="position:absolute;right:10px;top:12px;font-size:9px;color:#778582;font-weight:800">${u}</span></div></div>`
}
function sync(){
    d.observation=document.getElementById('obs').value;
    ['systolic','diastolic','pulse','temperature','spo2'].forEach(k=>d[k]=document.getElementById(k).value);
    save()
}
function sample(){
    document.getElementById('obs').value='Patient ki severe headache undi, vision blurred ga undi.';
    sync()
}
function fill(){
    if(d.scenario==='child')child();
    else demo()
}
function goStructure(){
    sync();
    if(localStorage.getItem(KEY))structure();
    else toast('Local save failed')
}
function structure(){
    sh(head('Local AI Demo','Structure & validate','Prototype local inference structures the input. Deterministic safety rules—not an LLM—control escalation.')+steps(2)+`<div class="process"><div class="processbox"><div class="title"><span class="titleicon">✦</span><div><b>Processing on this device</b><div class="muted" style="font-size:10px">No cloud connection used</div></div></div>${['Transcribing locally','Extracting observations','Applying safety rules','Generating explainable referral summary'].map((x,i)=>`<div class="processitem"><span id="p${i}" class="num ${i===0?'now':''}">${
        i+1
    }
    </span><b style="font-size:11px">${
        x
    }
    </b></div>`).join('')}</div></div>`);
    let i=0;
    let t=setInterval(()=>{
        if(i>3){
            clearInterval(t);
            structured();
            return
        }
        document.getElementById('p'+i).className='num done';
        if(i<3)document.getElementById('p'+(i+1)).className='num now';
        i++
    },450)
}
function risk(){
    let s=+d.systolic||0,x=+d.diastolic||0;
    if(s>=160||x>=110)return{
        level:'URGENT',rule:'Systolic ≥ 160 OR diastolic ≥ 110',detail:`BP ${s}/${x} exceeds the configured urgent threshold.`
    };
    if(s>=140||x>=90)return{
        level:'REVIEW',rule:'Systolic ≥ 140 OR diastolic ≥ 90',detail:`BP ${s}/${x} meets the configured review threshold.`
    };
    return{
        level:'ROUTINE',rule:'No configured escalation threshold met',detail:`BP ${s}/${x} remains below configured escalation thresholds.`
    }
}
function item(a,b){
    return `<div class="dl"><dt>${a}</dt><dd>${b}</dd></div>`
}
function structured(){
    let r=risk(),s=d.observation.toLowerCase().includes('headache')?'Severe headache, blurred vision':d.observation||'No symptoms entered';
    sh(head('Local AI Demo','Structure & validate','Prototype local inference structures the input. Deterministic safety rules—not an LLM—control escalation.')+steps(2)+`<div class="structured"><section class="info"><div class="title"><span class="titleicon">✦</span><h2>Structured observations</h2></div>${item('Symptoms',s)}${item('Blood pressure',d.systolic+'/'+d.diastolic+' mmHg')}${item('Pulse',(d.pulse||'—')+' bpm')}${item('SpO₂',(d.spo2||'—')+'%')}${item('Input language',d.language)}${item('AI extraction confidence','94% — prototype demo value')}</section><section class="info"><div class="title"><span class="titleicon">✓</span><h2>Safety boundary</h2></div><p class="muted">AI structured these observations; deterministic safety rules control escalation.</p><div class="safety">No diagnosis is generated. The result only indicates whether a configured escalation threshold was met.</div></section></div><details class="details" open><summary><b>Why this result?</b></summary><div style="margin-top:12px"><b class="eyebrow">Exact triggered rule</b><div class="code">${r.rule}</div><p class="muted">${r.detail} Configured escalation threshold met.</p></div></details><button class="btn" style="float:right;margin-top:14px" onclick="validate()">View risk & referral result →</button>`)
}
function validate(){
    let r=risk();
    sh(head('Rule-controlled result','Risk & referral','This demo reports an escalation status, not a diagnosis.')+steps(3)+`<section class="result ${r.level.toLowerCase()}"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:10px;letter-spacing:.14em">RISK STATUS</b><div class="risk">${r.level}</div></div><span style="font-size:52px;opacity:.35">⚠</span></div><hr><h2>Escalation threshold met</h2><p style="font-weight:700">${r.detail}</p><div class="resultaction">Next action: Refer according to local clinical protocol.</div></section><div class="two"><div class="card"><div class="eyebrow">Why this result?</div><p style="font-weight:800">${r.rule}</p><p class="muted">Configured escalation threshold met. No disease is named or diagnosed.</p></div><div class="dark"><span style="color:#f2d37a">◉</span><div><b>Offline status</b><p style="margin:5px 0;color:#b7c8c5">ACTIVE · Cloud calls: 0</p></div></div></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn out" onclick="capture()">↻ Start new case</button><button class="btn" onclick="report()">Generate referral →</button></div>`)
}
function report(){
    let r=risk();
    sh(head('On-device document','Referral summary','A concise handoff record generated from captured observations and the triggered safety rule.')+steps(4)+`<article class="report"><div class="reporthead"><div><div class="eyebrow">PulseEdge AI</div><h2>Referral Summary</h2></div><div style="text-align:right;font-size:10px"><b>${d.caseId}</b><br><span class="muted">${new Date(d.createdAt).toLocaleString()}</span></div></div><div class="reportgrid">${item('Captured observations',d.observation||'None recorded')}${item('Symptoms',d.observation||'None recorded')}${item('Vitals',`BP ${
        d.systolic
    }
    /${
        d.diastolic
    }
    mmHg · Pulse ${
        d.pulse
    }
    bpm · Temp ${
        d.temperature
    }
    °C · SpO₂ ${
        d.spo2
    }
    %`)}${item('Risk status',r.level)}${item('Triggered rule',r.rule)}${item('Recommended handoff','Refer according to local clinical protocol.')}</div><div class="muted" style="font-size:10px;border-top:1px solid #dce4df;padding-top:12px">Generated on device — prototype<br>This summary does not provide a diagnosis or independent treatment instructions.</div></article><div class="two"><div class="dark"><span style="color:#f2d37a">▣</span><div><b>Office Kit handoff · simulation</b><p style="margin:5px 0;color:#b7c8c5">Paired workstation ready</p><button class="btn soft" onclick="toast('Case summary shared with workstation (demo)')">Send case summary</button></div></div><div class="row"><button class="btn out" onclick="download()">↓ Export report</button><button class="btn" onclick="window.print()">▣ Print / Save</button></div></div>`)
}
function download(){
    let r=risk(),txt=`PulseEdge AI — Referral Summary\n${d.caseId}\n\nObservation\n${d.observation}\n\nVitals\nBP ${d.systolic}/${d.diastolic} mmHg\nPulse ${d.pulse}\nTemperature ${d.temperature}\nSpO2 ${d.spo2}\n\nRisk: ${r.level}\nRule: ${r.rule}\nNext action: Refer according to local clinical protocol.`;
    let a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{
        type:'text/plain'
    }));
    a.download=d.caseId+'-referral.txt';
    a.click();
    toast('Report exported')
}
function architecture(){
    active('arch');
    sh(head('For hackathon judges','Target production architecture','A local-first path from multimodal capture to explainable referral. Not all components are active in this web prototype.')+`<section class="architecture"><div class="eyebrow" style="color:#f2d37a">Data flow</div><h2>From observation to handoff</h2><div class="flow">${['Camera + microphone + vitals','Offline preprocessing','Local speech / vision models','Quantized local LLM','Deterministic safety engine','Explainable risk / referral','Encrypted local case storage','Clinician handoff'].map((x,i)=>`<div><span style="color:#f2d37a">${
        i+1
    }
    </span><br>${
        x
    }
    </div>`).join('')}</div><p style="font-size:10px;color:#a9bdb8">↓ All core safety decisions stay on the deterministic path.</p></section><div class="two"><div class="card"><div class="eyebrow">Target production stack</div><h2>Android-native, Snapdragon-accelerated</h2>${['Android / Kotlin + Jetpack Compose','Llama-family small quantized model','ExecuTorch + Qualcomm AI Engine Direct / QNN','Offline OCR / vision','Local speech recognition','SQLCipher encrypted local storage'].map(x=>`<div style="padding:9px;border:1px solid #dce4df;border-radius:7px;margin-top:7px;font-size:10px;font-weight:700">● ${
        x
    }
    </div>`).join('')}<div class="safety" style="margin-top:12px;background:#fff3cf;color:#66552a">Target production architecture — not all components are active in this prototype.</div></div><div><div class="card"><div class="eyebrow">Why on-device?</div><h2>Local-first by design</h2><p class="muted"><b style="color:#263a39">Connectivity</b> — reliable workflows in low-network settings.</p><p class="muted"><b style="color:#263a39">Privacy</b> — minimize movement of sensitive observations.</p><p class="muted"><b style="color:#263a39">Latency</b> — immediate structure and rule evaluation.</p></div><div class="card" style="border:2px solid #0a7168;background:#edf8f5"><b style="color:#0a7168">✓ Safety boundary</b><p style="font-size:11px;font-weight:700;color:#0a7168">The LLM structures information. Deterministic rules control escalation. The prototype does not diagnose.</p></div></div></div>`)
}
function settings(){
    active('set');
    sh(head('Privacy controls','Offline & data settings','PulseEdge is designed around local-first handling. These controls show the intended privacy posture of the prototype.')+`<div class="two"><div class="card">${[['◉','Offline mode','Core demo functions remain available without connectivity.'],['▣','Local processing preference','Structure observations locally for the prototype.'],['▤','Cloud upload','No case information is uploaded by this demo.']].map(x=>`<div class="settings"><span class="titleicon">${
        x[0]
    }
    </span><div style="flex:1"><b>${
        x[1]
    }
    </b><p class="muted" style="font-size:10px;margin:4px 0">${
        x[2]
    }
    </p></div><span class="switch"></span></div>`).join('')}</div><div><div class="card"><b>▣ Demo data retention</b><p><b>Session only</b></p><p class="muted" style="font-size:10px">Case data remains in this app. Production encryption and retention controls are target capabilities.</p></div><button class="btn out full" style="margin-top:10px;color:#a83b36" onclick="localStorage.removeItem(KEY);d={...d,observation:'',systolic:'',diastolic:'',pulse:'',temperature:'',spo2:'',image:''};home();toast('Demo session cleared')">⌫ Clear demo session</button></div></div>`)
}
function voice(){
    toast('Offline voice service may be unavailable — type observation manually');
    document.getElementById('obs')?.focus()
}
async function cam(){
    let v=document.getElementById('video');
    try{
        let s=await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:'environment'
            }
        });
        v.srcObject=s;
        v.classList.remove('hidden');
        toast('Camera ready')
    }
    catch(e){
        toast('Camera permission unavailable')
    }
}
function upload(){
    let i=document.createElement('input');
    i.type='file';
    i.accept='image/*';
    i.onchange=()=>{
        let f=i.files[0];
        if(!f)return;
        let r=new FileReader();
        r.onload=()=>{
            d.image=r.result;
            save();
            document.getElementById('visual').innerHTML='<img src="'+r.result+'">';
            toast('Image stored locally')
        };
        r.readAsDataURL(f)
    };
    i.click()
}
home();
</script></body>
